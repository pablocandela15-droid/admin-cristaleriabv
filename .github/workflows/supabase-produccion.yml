# ============================================================================
#  Supabase · producción (al aceptar una release)
# ----------------------------------------------------------------------------
#  Cuando una release entra en `main` (o a mano, «Run workflow»):
#    1. Migraciones: `supabase db push` aplica las de supabase/migrations que
#       aún no estén en el historial del proyecto (las ya aplicadas no se tocan).
#       Solo si existe el secreto SUPABASE_DB_PASSWORD; si no, se salta y avisa.
#    2. Funciones: `supabase functions deploy` despliega TODAS las de
#       supabase/functions con su verify_jwt de supabase/config.toml.
#
#  Configuración (GitHub → Settings → Secrets and variables → Actions):
#    Variable  SUPABASE_REF_PRODUCCION  ref del proyecto de producción (no es secreto)
#    Secreto   SUPABASE_ACCESS_TOKEN    token personal de Supabase (Account → Access Tokens)
#    Secreto   SUPABASE_DB_PASSWORD     contraseña de la base de datos (opcional: migraciones)
#  Los secretos de las propias funciones (OPENAI_API_KEY…) viven en Supabase,
#  no aquí: ver docs/DESPLIEGUE.md.
# ============================================================================
name: Supabase · producción

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - "supabase/migrations/**"
      - "supabase/config.toml"
  workflow_dispatch:

concurrency:
  group: supabase-produccion
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  desplegar:
    name: Migraciones y funciones
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROYECTO_REF: ${{ vars.SUPABASE_REF_PRODUCCION }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Comprobar configuración
        run: |
          falta=""
          [ -n "$PROYECTO_REF" ] || falta="$falta variable SUPABASE_REF_PRODUCCION;"
          [ -n "$SUPABASE_ACCESS_TOKEN" ] || falta="$falta secreto SUPABASE_ACCESS_TOKEN;"
          if [ -n "$falta" ]; then
            echo "::error::Falta configurar en GitHub (Settings → Secrets and variables → Actions):$falta"
            exit 1
          fi
          [ -n "$SUPABASE_DB_PASSWORD" ] || echo "::warning::Sin SUPABASE_DB_PASSWORD: no se aplican migraciones, solo funciones."

      # Versión fija: la 3.x cambió las opciones (db push necesita --remote y functions deploy ya no
      # admite --project-ref). Al subirla, comprobar `supabase db push --help` y `functions deploy --help`.
      - uses: supabase/setup-cli@v1
        with:
          version: 3.3.0

      - name: Enlazar el proyecto
        run: supabase link --project-ref "$PROYECTO_REF"

      - name: Migraciones pendientes
        if: env.SUPABASE_DB_PASSWORD != ''
        # --skip-vault: los secretos de Vault se gestionan a mano en Supabase (ver docs/DESPLIEGUE.md).
        run: |
          supabase db push --remote --password "$SUPABASE_DB_PASSWORD" --skip-vault --dry-run --yes
          supabase db push --remote --password "$SUPABASE_DB_PASSWORD" --skip-vault --yes

      - name: Desplegar funciones
        run: supabase functions deploy --use-api --yes
